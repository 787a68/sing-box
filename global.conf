{
  // global.conf — 代理规则集（拆分为域名版 + IP 版）
  // 上游来源：quantumult-x 仓库搬迁
  //   - ConnersHua/RuleGo Proxy.list（Surge 规则）
  //   - Loyalsoldier/surge-rules gfw.txt（域名后缀列表）
  // exclude：qx 仓库的 -host / -host-suffix 排除项
  // 拆分说明：
  //   global-domain — route 嗅探后 / dns fakeip（纯域名，无 legacy 告警）
  //   global-ip     — 预留输出（上游暂无独立 IP 源时自动跳过）
  "sources": [
    {
      "url": "https://raw.githubusercontent.com/ConnersHua/RuleGo/master/Surge/Ruleset/Proxy.list",
      "format": "clash"
    },
    {
      "url": "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/gfw.txt",
      "format": "host"
    }
  ],
  "exclude": [
    { "domain": ["gateway.icloud.com"] },
    { "domain_suffix": ["apple.com"] }
  ],
  "outputs": [
    { "tag": "global-domain", "fields": ["domain", "domain_suffix", "domain_keyword", "domain_regex"] },
    { "tag": "global-ip",     "fields": ["ip_cidr", "source_ip_cidr"] }
  ]
}
