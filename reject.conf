{
  // reject.conf —— 拒绝/广告拦截规则集（拆分为域名版 + IP 版）
  // 上游来源：quantumult-x 仓库搬迁（5 个源）
  //   - geekdada/surge-list dns-filter（域名后缀列表）
  //   - geekdada/surge-list chinese-filter（域名后缀列表）
  //   - TG-Twilight/AWAvenue-Ads-Rule（纯域名列表）
  //   - badmojr/1Hosts Lite（纯域名列表，约 20 万条）
  //   - fmz200/wool_scripts filter.list（QX 行格式，含 29 条 IP-CIDR）
  // 拆分说明：
  //   reject-domain —— route 嗅探后 / dns 查询拒绝（纯域名 + query_type，无 legacy 告警）
  //   reject-ip     —— route 嗅探前 / dns 响应匹配（evaluate + match_response，仅 IP）
  "sources": [
    {
      "url": "https://raw.githubusercontent.com/geekdada/surge-list/master/domain-set/dns-filter.txt",
      "format": "host"
    },
    {
      "url": "https://raw.githubusercontent.com/geekdada/surge-list/master/domain-set/chinese-filter.txt",
      "format": "host"
    },
    {
      "url": "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge.list",
      "format": "host"
    },
    {
      "url": "https://raw.githubusercontent.com/badmojr/1Hosts/master/Lite/domains.txt",
      "format": "host"
    },
    {
      "url": "https://raw.githubusercontent.com/fmz200/wool_scripts/main/QuantumultX/filter/filter.list",
      "format": "qx"
    }
  ],
  "head_rules": [
    { "query_type": ["PTR", "SVCB", "HTTPS", "ANY", "AXFR", "IXFR", "TSIG", "TKEY"] },
    { "domain_keyword": ["adserv", "advert", "adsdk", "adx", "adtarget", "adsys", "beacon", "tracker", "umeng", "dsp", "rtb", "adnet", "admob", "pangolin"] }
  ],
  "outputs": [
    { "tag": "reject-domain", "fields": ["domain", "domain_suffix", "domain_keyword", "domain_regex", "query_type"] },
    { "tag": "reject-ip", "fields": ["ip_cidr", "source_ip_cidr"] }
  ]
}
